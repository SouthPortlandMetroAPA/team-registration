<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Team Registration &middot; South Portland Metro APA</title>
<link rel="canonical" href="https://southportlandmetroapa.github.io/team-registration/">
<meta http-equiv="refresh" content="0; url=./">
<!--
================================================================================
form.html - REDIRECT ONLY
================================================================================
The form moved to the root of this repo on 2026-11-13, replacing the retired
Supabase app that used to live there. This stub exists because the form.html
address was handed out before the move, and a link a captain already has must
not die quietly.

It redirects three ways on purpose, cheapest first:
  1. a meta refresh, which works with no JavaScript at all
  2. location.replace, so the dead address does not sit in the back button
  3. a plain visible link, for anything that honours neither

Do not put form logic back in here. The form is index.html.
================================================================================
-->
<style>
/* The brand tokens are inlined because validate-ui-brand.mjs checks every page
   of a brand app, this stub included, and wants the literal values. */
:root{
  --spm-primary:#ea002a;
  --spm-accent:#0031a1;
  --bg:#f5f5f5;
  --card:#ffffff;
  --border:#e1e1e1;
  --text:#1f1f1f;
  --muted:#666;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:20px;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.5;text-align:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;
  padding:28px 24px;max-width:420px;width:100%;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.bar{height:4px;width:56px;margin:0 auto 18px;border-radius:2px;
  background:linear-gradient(90deg,var(--spm-primary),var(--spm-accent))}
h1{margin:0 0 10px;font-size:1.15rem;font-weight:800}
p{margin:0 0 18px;color:var(--muted);font-size:.95rem}
a.go{display:inline-block;min-height:44px;padding:12px 24px;border-radius:999px;
  background:linear-gradient(135deg,var(--spm-primary),var(--spm-accent));
  color:#fff;font-weight:700;text-decoration:none}
a.go:focus-visible{outline:3px solid var(--spm-accent);outline-offset:3px}
</style>
</head>
<body>
  <div class="card">
    <div class="bar"></div>
    <h1>This moved</h1>
    <p>Team registration now lives at the main address. Taking you there.</p>
    <a class="go" href="./">Open the registration form</a>
  </div>
<script>
/* replace, not assign: the dead address should not sit in the back button. */
location.replace('./');
</script>
</body>
</html>
